[module]
id = "em/lfolength"
version = "0.1.0"
name = "LFO ONE/HALF fix"
category = "lfo"
type = "raw"
author = "em"
status = "experimental"
summary = "LFO TRIG MODE ONE e HALF fanno un ciclo / mezzo ciclo dal punto di partenza (SPH) e tengono il valore raggiunto, su tracce audio e MIDI (porting di lfolength di dn2_firmware_explore). Solo Digitone II 1.11."
ports = ["dn2-1.12"]
requires = []
conflicts = []

[targets]
"dn2-1.12" = "experimental"

[[object]]
path = "build/lfolength.dko.json"
sources = ["src/cf/lfolength.s"]
place = "cf.expansion"

# --- quattro ganci (jmp; le istruzioni spostate le riesegue il codice del modulo) ---
[[op]]
op = "hook"
hook = "em.lfol.a_trig.hook"
to = "lfa_trig"
[[op]]
op = "hook"
hook = "em.lfol.a_wave.hook"
to = "lfa_wave"
[[op]]
op = "hook"
hook = "em.lfol.b_trig.hook"
to = "lfb_trig"
[[op]]
op = "hook"
hook = "em.lfol.b_wave.hook"
to = "lfb_wave"
[[op]]                       # A HALF: movel %a0@,%a2@(84)
op = "write"
anchor = "em.lfol.a_half"
hex = "4e714e71"

[[op]]                       # A ONE: movel %a0,%a2@(84)
op = "write"
anchor = "em.lfol.a_one"
hex = "4e714e71"

[[op]]                       # B HALF: movel %a0@(0,%d3:l:4),%a5@
op = "write"
anchor = "em.lfol.b_half"
hex = "4e714e71"

[[op]]                       # B ONE: movel %d1,%a5@
op = "write"
anchor = "em.lfol.b_one"
hex = "4e71"

[[claim]]
resource = "em.lfol.a_trig"
[[claim]]
resource = "em.lfol.a_wave"
[[claim]]
resource = "em.lfol.b_trig"
[[claim]]
resource = "em.lfol.b_wave"
[[claim]]
resource = "em.lfol.hold"

# --- siti (firme uniche sull'OS 1.11 di serie, controllate con tmp_claude/v59/parole_lfolength.py) ---
[[anchor_rule]]
name = "em.lfol.a_trig"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x242f0044, 0x203c5265, 0xc0004842]
offset = 0
len = 10
mark = "D"

[[anchor_rule]]
name = "em.lfol.a_wave"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x203c636b, 0xa875a400, 0x0800a1c2]
offset = 0
len = 6
mark = "D"

[[anchor_rule]]
name = "em.lfol.b_trig"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x716c002c, 0x243c0149, 0x97004840]
offset = 0
len = 10
mark = "D"

[[anchor_rule]]
name = "em.lfol.b_wave"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x7006b083, 0x6730103c, 0x003243f9]
offset = 0
len = 6
mark = "D"

[[anchor_rule]]
name = "em.lfol.a_half"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x25500054, 0x16bc0001, 0x0c825265]
offset = 0
len = 4
mark = "D"

[[anchor_rule]]
name = "em.lfol.a_one"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x25480054, 0x16bc0001, 0x4a866d08]
offset = 0
len = 4
mark = "D"

[[anchor_rule]]
name = "em.lfol.b_half"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x2ab03c00, 0x16bc0001, 0x0c820149]
offset = 0
len = 4
mark = "D"

[[anchor_rule]]
name = "em.lfol.b_one"
cpu = "cf"
kind = "cf_words"
as = "code"
words = [0x2a8116bc, 0x00014a8e, 0x6d080682]
offset = 0
len = 2
mark = "D"
