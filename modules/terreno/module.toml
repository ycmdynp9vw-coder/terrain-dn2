[module]
id = "em/terreno"
version = "3.3.1"
name = "Terrain"
category = "machines"
type = "machine"
author = "em"
status = "experimental"
summary = "(3.3: page 4 phase fine, sync, key track; page 5 drum: pitch sweep and noise as FM DRUM) Terrain synthesis: a point (x, y) runs over a 2-D surface; its height is the sound. Twin X and Y axes (tune, wave, size, center), 8 banks of 8 surfaces (classic, harmonic, edges, chaos, FM, fold, bits, Chebyshev), warp, grain, position, zoom, mod, phase distortion; X and Y phase; land page: aspect, rotation, grain, curve, erosion, ridge, wind, feedback."
ports = ["dn2-1.12"]
requires = ["core/dsp-voice", "core/machines", "core/params"]
conflicts = []

[targets]
"dn2-1.12" = "experimental"

[[object]]
path = "build/terreno-dsp.dko.json"
sources = ["src/dsp/terreno.s"]
place = "dsp.l2"

[[object]]
path = "build/terreno-cf.dko.json"
sources = ["src/module.c"]
place = "cf.expansion"

# digikit nuovo (13/11): [[machine]] e [[voice]] sono ora DK_MACHINE in src/module.c
